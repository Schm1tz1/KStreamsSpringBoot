name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # unit tests (surefire) + *IT (failsafe, embedded Kafka); nothing is deployed
      - run: mvn --batch-mode verify
